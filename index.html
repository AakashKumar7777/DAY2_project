<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <div class="circle"></div>
            <h2>Verdant</h2>
        </div>

        <ul>
            <li><a href="#">Care</a></li>
            <li><a href="#">Schedule</a></li>
            <li><a href="#">Journal</a></li>
            <li><a href="#">Join</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <div class="left">

            <p class="small">INDOOR PLANT STUDIO</p>

            <h1>
                Grow a room that
                <span>breathes</span>
                with you.
            </h1>

            <p class="desc">
                Verdant is a tiny studio pairing hardy houseplants with
                simple, honest care advice. No jargon — just greener days.
            </p>

            <div class="buttons">
                <a href="#" class="btn dark">Start your collection</a>
                <a href="#" class="btn light">Learn the basics</a>
            </div>

        </div>

        <div class="right">

            <div class="card">

                <div class="stem"></div>

                <div class="leaf leaf1"></div>
                <div class="leaf leaf2"></div>
                <div class="leaf leaf3"></div>

                <div class="pot"></div>

            </div>

        </div>

    </section>

</body>
</html>
